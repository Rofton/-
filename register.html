<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Ателье «Нить»</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">Ателье «Нить»</a>
      <a class="back-link" href="index.html">← На главную</a>
    </div>
  </header>

  <main class="auth">
    <section class="auth__card">
      <h1>Регистрация</h1>
      <p class="notice" id="notice" hidden></p>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="fio">ФИО</label>
          <input id="fio" type="text" placeholder="Иванова Анна Сергеевна" autocomplete="name" required>
          <div class="error" data-error></div>
        </div>
        <div class="field">
          <label for="phone">Телефон</label>
          <input id="phone" type="tel" placeholder="+7 ___ ___-__-__" autocomplete="tel" required>
          <div class="error" data-error></div>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="name@mail.ru" autocomplete="email" required>
          <div class="error" data-error></div>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" placeholder="не короче 8 символов" autocomplete="new-password" required>
          <div class="error" data-error></div>
        </div>
        <div class="field">
          <label for="password2">Повторите пароль</label>
          <input id="password2" type="password" autocomplete="new-password" required>
          <div class="error" data-error></div>
        </div>
        <label class="check">
          <input id="agree" type="checkbox"> Согласен на обработку персональных данных
        </label>
        <div class="error" data-error id="agree-error" style="margin:-10px 0 12px"></div>
        <button class="btn btn--block" type="submit">Зарегистрироваться</button>
      </form>
      <p class="auth__alt">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
